name: Weekly Results

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        required: false
        default: dry-run
        type: choice
        options:
          - dry-run
          - live
          - diagnose
      target_week:
        description: 'Optional draw week for diagnose mode (YYYY-Www)'
        required: false
        type: string

jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    env:
      DHLOTTERY_USERNAME: ${{ secrets.DHLOTTERY_USERNAME }}
      DHLOTTERY_PASSWORD: ${{ secrets.DHLOTTERY_PASSWORD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      RESULT_MODE: ${{ github.event_name == 'schedule' && 'live' || inputs.mode }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Run summarize command
        if: ${{ env.RESULT_MODE != 'diagnose' }}
        run: node --experimental-strip-types src/cli.ts summarize --mode="$RESULT_MODE"

      - name: Diagnose full result flow without purchase or notifications
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'diagnose' }}
        env:
          TELEGRAM_BOT_TOKEN: ''
          TELEGRAM_CHAT_ID: ''
          RESULT_TARGET_WEEK: ${{ inputs.target_week }}
        run: node --experimental-strip-types src/scripts/diagnose-results.ts

      - name: Upload summary artifact
        if: ${{ always() && env.ACT != 'true' && env.RESULT_MODE != 'diagnose' }}
        uses: actions/upload-artifact@v4
        with:
          name: weekly-summary-${{ github.run_id }}
          path: artifacts/weekly-summary.txt
          if-no-files-found: ignore
