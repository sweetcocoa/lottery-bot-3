name: Weekly Results

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        required: false
        default: dry-run
        type: choice
        options:
          - dry-run
          - live
          - diagnose
          - probe
      target_week:
        description: 'Optional draw week for diagnose mode (YYYY-Www)'
        required: false
        type: string

jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    env:
      DHLOTTERY_USERNAME: ${{ secrets.DHLOTTERY_USERNAME }}
      DHLOTTERY_PASSWORD: ${{ secrets.DHLOTTERY_PASSWORD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PLAYWRIGHT_CHROMIUM_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Verify Playwright with system Chrome
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'live' || inputs.mode == 'diagnose' || inputs.mode == 'probe' }}
        run: |
          google-chrome --version
          node --input-type=module -e \
            "import { chromium } from 'playwright'; const browser = await chromium.launch({ channel: 'chrome', headless: true }); await browser.close();"

      - name: Ensure artifacts dir
        run: mkdir -p artifacts

      - name: Run summarize command
        if: ${{ github.event_name == 'schedule' || (inputs.mode != 'diagnose' && inputs.mode != 'probe') }}
        run: |
          node --experimental-strip-types src/cli.ts summarize \
            --mode=${{ github.event_name == 'schedule' && 'live' || inputs.mode }}

      - name: Diagnose full result flow without purchase or notifications
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'diagnose' }}
        env:
          TELEGRAM_BOT_TOKEN: ''
          TELEGRAM_CHAT_ID: ''
          RESULT_TARGET_WEEK: ${{ inputs.target_week }}
        run: node --experimental-strip-types src/scripts/diagnose-results.ts

      - name: Inspect read-only history response shapes
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'probe' }}
        env:
          TELEGRAM_BOT_TOKEN: ''
          TELEGRAM_CHAT_ID: ''
        run: node --experimental-strip-types src/scripts/probe-history-contract.ts

      - name: Upload summary artifact
        if: ${{ always() && env.ACT != 'true' && (github.event_name == 'schedule' || (inputs.mode != 'diagnose' && inputs.mode != 'probe')) }}
        uses: actions/upload-artifact@v4
        with:
          name: weekly-summary-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
